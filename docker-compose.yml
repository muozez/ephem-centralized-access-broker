version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ephem-postgres
    restart: always
    environment:
      POSTGRES_USER: ephem
      POSTGRES_PASSWORD: ephem_password
      POSTGRES_DB: ephem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ephem -d ephem"]
      interval: 5s
      timeout: 5s
      retries: 5

  ephem-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ephem-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://ephem:ephem_password@postgres:5432/ephem?sslmode=disable
      - SSH_CA_PRIVATE_KEY_PATH=/shared/ssh_ca.key
      - SSH_CA_PUBLIC_KEY_PATH=/shared/ssh_ca.pub
      - OIDC_ALLOWED_DOMAINS=company.com
      - OIDC_ALLOW_JIT_PROVISIONING=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_password
      - MTLS_CERT_DIR=/shared/certs
    volumes:
      - .:/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  target-ssh:
    build:
      context: .
      dockerfile: Dockerfile.ssh
    container_name: ephem-target-ssh
    restart: always
    ports:
      - "2222:22"
    volumes:
      - .:/shared:ro
    depends_on:
      - ephem-api

  redis:
    image: redis:7-alpine
    container_name: ephem-redis
    restart: always
    command: redis-server --requirepass redis_password
    ports:
      - "6379:6379"

  ephem-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: ephem-agent
    restart: always
    ports:
      - "50051:50051"
    environment:
      - AGENT_PORT=50051
      - MTLS_CERT_DIR=/shared/certs
      - AGENT_CONFIG_PATH=/shared/agent_config.json
    volumes:
      - .:/shared
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data:
