version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ephem-postgres
    restart: always
    environment:
      POSTGRES_USER: ephem
      POSTGRES_PASSWORD: ephem_password
      POSTGRES_DB: ephem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ephem -d ephem"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
